<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E2001A">
<title>Oefentoetsen Basis Nederlands</title>
<script>try{var t=localStorage.getItem('bn_theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --w:1240px; --pad:clamp(16px,3vw,40px);
  --red:#E2001A; --red-dark:#B30015; --red-soft:#FDE8EA;
  --ink:#1D1D1B; --ink-2:#55554F; --line:#DEDEDA; --paper:#FFFFFF; --mist:#F4F4F2;
  --ok:#1E7B3A; --ok-soft:#E3F3E7; --bad:#C4001A; --bad-soft:#FDE8EA;
  --c-ww:#2F6FB5; --c-zb:#C98A00; --c-tg:#3E8E41; --c-sp:#E0662A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --red:#FF2D43; --red-dark:#E2001A; --red-soft:#3A1418;
    --ink:#F2F2EF; --ink-2:#B4B4AE; --line:#3A3A37; --paper:#1F1F1D; --mist:#151514;
    --ok:#5BC77A; --ok-soft:#173222; --bad:#FF5A6C; --bad-soft:#3A1418;
    --c-ww:#6FA6E8; --c-zb:#F0BE3C; --c-tg:#74C477; --c-sp:#FF8F5A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --red:#FF2D43; --red-dark:#E2001A; --red-soft:#3A1418;
    --ink:#F2F2EF; --ink-2:#B4B4AE; --line:#3A3A37; --paper:#1F1F1D; --mist:#151514;
    --ok:#5BC77A; --ok-soft:#173222; --bad:#FF5A6C; --bad-soft:#3A1418;
    --c-ww:#6FA6E8; --c-zb:#F0BE3C; --c-tg:#74C477; --c-sp:#FF8F5A;
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--mist);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* Top bar: the HR red block */
.bar{background:var(--red);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:11}
.bar-in{max-width:var(--w);margin:0 auto;padding:12px var(--pad);display:flex;align-items:center;gap:14px;min-height:56px}
.logo{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;line-height:1.1;background:none;border:0;padding:0;color:#fff;text-align:left}
.logo small{display:block;font-weight:500;font-size:.78rem;opacity:.9}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-weight:600}
.bar-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:6px;padding:6px 12px;font-size:.9rem;font-weight:600}
.bar-btn{transition:background .15s,transform .12s}
.bar-btn:active{transform:scale(.94)}
@media (hover:hover){.bar-btn:hover{background:rgba(255,255,255,.28)}}
/* theme + icon buttons: fixed size, so light and dark look identical */
.theme-btn,.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;line-height:1;height:34px;flex:none}
.theme-btn svg,.icon-btn svg{width:18px;height:18px;flex:none;display:block}
.theme-btn .lbl{display:inline-grid}
.theme-btn .lbl>span{grid-area:1/1}
.theme-btn .lbl>.off{visibility:hidden}
.icon-btn{width:36px;padding:0}
@media (max-width:480px){.theme-btn .lbl{display:none}.theme-btn{width:36px;padding:0}}
.theme-btn.spin svg{animation:spin .5s cubic-bezier(.2,.8,.2,1)}
.icon-btn.spin svg{animation:spinBack .5s cubic-bezier(.2,.8,.2,1)}
.timer.low{background:#fff;color:var(--red-dark);border-radius:6px;padding:2px 8px}

main{max-width:var(--w);margin:0 auto;padding:clamp(20px,3vw,36px) var(--pad) 120px}
main.narrow{max-width:980px}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;letter-spacing:-.02em;margin:.2em 0 .35em;font-weight:800}
h2{font-size:1.15rem;margin:1.8em 0 .6em;font-weight:700}
p.lead{color:var(--ink-2);margin:0 0 1.2em;max-width:60ch}
.center{text-align:center;margin-left:auto;margin-right:auto}
h1.center{margin-top:.3em}
p.lead.center{margin:0 auto 1.6em}

/* Home */
.versions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:999px){.versions{gap:10px}.vbtn{padding:14px;min-height:130px}.vtxt b{font-size:1rem}.vtxt .vn{display:none}}
@media (max-width:759px){.versions{grid-template-columns:1fr}.vtxt .vn{display:inline}}
.vbtn{display:flex;flex-direction:column;align-items:flex-start;gap:14px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:18px;text-align:left;min-height:150px;transition:border-color .15s,background .15s}
@media (hover:hover){.vbtn:hover{border-color:var(--red);background:var(--red-soft)}}
.vnum{width:46px;height:46px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.vtxt b{display:block;font-size:1.15rem;line-height:1.2;white-space:nowrap}
.vtxt > span{display:block;font-size:.88rem;color:var(--ink-2)}
.vtxt .vscore{margin-top:2px;font-weight:600;color:var(--ink-2)}
.vtxt i, .hgrade{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
i.pass,.hgrade.pass{color:var(--ok)} i.fail,.hgrade.fail{color:var(--bad)}
.hist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.hrow{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;width:100%}
.hgrade{font-size:1.5rem;min-width:2.4em}
.hmain{flex:1;min-width:0}.hmain b{display:block}.hmain span{font-size:.85rem;color:var(--ink-2)}
.hgo{font-size:.85rem;font-weight:700;color:var(--red)}
@media (hover:hover){.hrow:hover{border-color:var(--red)}}
.hist-actions{display:flex;gap:18px;margin-top:10px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
@media (hover:hover){.linkbtn:hover{color:var(--ink)}}
@media (max-width:759px){.vbtn{flex-direction:row;align-items:center;min-height:0;padding:14px 16px}.vnum{width:40px;height:40px;font-size:1.2rem}}
.mix{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mixbtn{display:flex;gap:14px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left}
@media (hover:hover){.mixbtn:hover{border-color:var(--red)}}
.mixbtn .ico{flex:none;width:40px;height:40px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.mixbtn strong{display:block;color:var(--ink);font-size:1.02rem}
.mixbtn span{font-size:.88rem;color:var(--ink-2)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:1000px){.cats{grid-template-columns:repeat(4,1fr)}}
@media (max-width:480px){.cats{grid-template-columns:1fr}}
.catbtn{background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--cc);border-radius:10px;padding:12px 14px;text-align:left}
@media (hover:hover){.catbtn:hover{border-color:var(--cc)}}
.catbtn strong{display:block}
.catbtn span{font-size:.85rem;color:var(--ink-2)}
.opts{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px}
.opts label{display:flex;gap:10px;align-items:center;cursor:pointer}
.opts input{width:20px;height:20px;accent-color:var(--red)}
.note{font-size:.85rem;color:var(--ink-2);margin-top:20px;border-top:1px solid var(--line);padding-top:14px}

.exam{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:.95rem;display:grid;gap:6px}
.exam ul{max-width:420px}
.split{display:grid;gap:0 40px}
@media (min-width:1000px){.split{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.review{grid-template-columns:1fr 1fr;align-items:start}}
@media (min-width:900px){.results-top{display:grid;grid-template-columns:minmax(260px,.8fr) 1.2fr;gap:40px;align-items:end}.results-top h2{margin-top:0}}
.exam ul{list-style:none;margin:2px 0;padding:0;display:grid;gap:4px}
.exam li{display:flex;align-items:center;gap:8px}
.exam li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}
.exam li b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
/* Quiz */
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:.9rem;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--cc)}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--red);transition:width .25s}
.qnum{font-size:.9rem;font-weight:700;color:var(--red)}
.sentence{font-size:clamp(1.3rem,4.2vw,1.75rem);line-height:1.45;font-weight:600;letter-spacing:-.01em;margin:6px 0 10px;overflow-wrap:anywhere}
.slot{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--red);padding:0 .15em;color:var(--red);text-align:center;line-height:1.2}
.sentence.revealed .slot{color:var(--ok);border-bottom-color:var(--ok)}
.slot.empty{color:var(--ink-2);font-weight:500;font-size:.8em}
.instr{color:var(--ink-2);margin:0 0 18px;font-size:1rem}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;font-size:1.05rem;min-height:56px}
@media (hover:hover){.choice:hover{border-color:var(--ink-2)}}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.choice[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.choice[aria-pressed="true"] .k{background:var(--red);border-color:var(--red);color:#fff}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.feedback b{display:block;margin-bottom:4px}
.feedback.ok b{color:var(--ok)} .feedback.no b{color:var(--bad)}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:9;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:980px;margin:0 auto;padding:10px var(--pad);display:flex;gap:10px;align-items:center}
.btn{border-radius:8px;padding:12px 18px;font-weight:700;border:2px solid var(--line);background:var(--paper);min-height:48px}
@media (hover:hover){.btn:hover{border-color:var(--ink-2)}}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
@media (hover:hover){.btn.primary:hover{background:var(--red-dark);border-color:var(--red-dark)}}
.btn:disabled{opacity:.4;cursor:default}
.nav .grow{flex:1}
.gridbtn{font-variant-numeric:tabular-nums}

/* Question overview sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--paper);width:100%;max-width:980px;max-height:80vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.dot{height:42px;border-radius:6px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;border-bottom:4px solid var(--cc)}
.dot.done{background:var(--mist)}
.dot.cur{border-color:var(--red)}
.dot.r{background:var(--ok-soft)} .dot.w{background:var(--bad-soft)}
.legend{font-size:.8rem;color:var(--ink-2);margin-top:12px}

/* Results */
.score{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin:8px 0 6px}
.grade{font-size:clamp(4rem,16vw,6.5rem);line-height:.9;font-weight:800;letter-spacing:-.04em;color:var(--red);font-variant-numeric:tabular-nums}
.grade.pass{color:var(--ok)}
.score-txt{padding-bottom:8px}
.score-txt b{font-size:1.4rem;display:block}
.score-txt span{color:var(--ink-2)}
.catrows{display:grid;gap:12px;margin-top:8px}
.catrow{display:grid;grid-template-columns:150px 1fr 64px;gap:12px;align-items:center;font-size:.95rem}
@media (max-width:480px){.catrow{grid-template-columns:1fr 64px}.catrow .meter{grid-column:1/-1;order:3}}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--cc)}
.catrow .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.filter{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.filter button{border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 14px;font-weight:600;font-size:.9rem}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.review{display:grid;gap:12px}
.ritem{scroll-margin-top:80px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:10px;padding:14px 16px}
.ritem.ok{border-left-color:var(--ok)}
.ritem .top{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
.ritem .s{font-weight:600;margin-bottom:8px}
.ritem .s .slot{min-width:3em;font-size:1em;color:var(--ok);border-bottom-color:var(--ok)}
.ans{font-size:.95rem;display:grid;gap:2px}
.ans .yours{color:var(--bad)} .ans .good{color:var(--ok);font-weight:700}
.why{margin-top:10px;padding:10px 12px;background:var(--mist);border-radius:8px;font-size:.95rem}
.why b{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:2px}
.empty-state{padding:24px;text-align:center;color:var(--ink-2);background:var(--paper);border-radius:10px;border:1px dashed var(--line)}

/* ---------- Motion ---------- */
html{overflow-x:clip}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideFromRight{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes slideFromLeft{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes softPop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes slotIn{from{opacity:0;transform:translateY(-8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes gradeIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes navIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes spin{from{transform:rotate(-120deg) scale(.6);opacity:.2}to{transform:none;opacity:1}}
@keyframes spinBack{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes countPop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

#app.in-up{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1)}
#app.in-next{animation:slideFromRight .3s cubic-bezier(.2,.7,.2,1)}
#app.in-prev{animation:slideFromLeft .3s cubic-bezier(.2,.7,.2,1)}
.stagger>*{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0) * 45ms)}

/* cards lift a little on hover, press down on tap */
.vbtn,.mixbtn,.catbtn,.hrow{transition:border-color .15s,background .15s,transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s}
@media (hover:hover){.vbtn:hover,.mixbtn:hover,.catbtn:hover,.hrow:hover{transform:translateY(-3px);box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}}
.vbtn:active,.mixbtn:active,.catbtn:active,.hrow:active{transform:scale(.98);box-shadow:none}
.vnum,.mixbtn .ico{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
@media (hover:hover){.vbtn:hover .vnum,.mixbtn:hover .ico{transform:rotate(-6deg) scale(1.08)}}
.btn{transition:border-color .15s,background .15s,transform .12s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.filter button,.linkbtn{transition:background .15s,color .15s,border-color .15s,transform .12s}
.filter button:active{transform:scale(.95)}

/* quiz */
.choice{transition:border-color .15s,background .15s,transform .12s}
.choice:active:not(:disabled){transform:scale(.985)}
.choice .k{transition:background .15s,border-color .15s,color .15s}
.choice.just .k{animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.slot.pop{animation:slotIn .3s cubic-bezier(.2,.8,.2,1)}
.choice.right.anim{animation:softPop .45s cubic-bezier(.3,1.4,.5,1)}
.choice.right.anim .k{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
.choice.wrong.anim{animation:shake .4s ease}
.feedback.anim{animation:fadeUp .35s cubic-bezier(.2,.7,.2,1) both;animation-delay:.08s}
.progress i{transition:width .45s cubic-bezier(.2,.7,.2,1)}
.nav{animation:navIn .3s cubic-bezier(.2,.7,.2,1)}
.gridbtn.bump{animation:countPop .3s ease}

/* overview sheet: backdrop fades, panel slides up */
.sheet{display:flex;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s linear .3s}
.sheet.open{visibility:visible;opacity:1;transition:opacity .25s}
.sheet-in{transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open .sheet-in{transform:none}
.dot{transition:transform .12s,background .15s}
.dot:active{transform:scale(.92)}

/* results */
.grade.anim{animation:gradeIn .6s cubic-bezier(.2,.8,.2,1) both}
.meter i{transition:width .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 90ms + .15s)}
.review>*{animation:fadeUp .35s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0) * 35ms)}

/* smooth colour change when switching theme */
html.theme-anim,html.theme-anim *,html.theme-anim *::before{transition:background-color .35s ease,border-color .35s ease,color .35s ease,fill .35s ease!important}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="logo" id="home">Basis Nederlands<small>Oefentoetsen · Hogeschool Rotterdam</small></button>
  <div class="bar-right"><span id="barRight" class="bar-right"></span><button class="bar-btn theme-btn" id="themeBtn" type="button"></button></div>
</div></header>
<main id="app"></main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Overzicht van de vragen"><div class="sheet-in" id="sheetIn"></div></div>

<script>

/* ---------- motion helpers ---------- */
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
// (re)start a CSS animation by toggling a class
function replayAnim(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
// page-level entrance: 'up' (new screen), 'next' / 'prev' (question to question)
function enter(dir){
  const app = document.getElementById('app');
  app.classList.remove('in-up', 'in-next', 'in-prev');
  if (!dir) return;
  void app.offsetWidth; app.classList.add('in-' + dir);
}
// give children of a container an index so they appear one after another
function stagger(sel, max = 12){ document.querySelectorAll(sel).forEach(box => { box.classList.add('stagger'); return [...box.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, max))); }); }
// count a number up from `from` to `to`
function countUp(el, from, to, ms, format){
  if (!el) return;
  if (reduceMotion()) { el.textContent = format(to); return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    el.textContent = format(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  el.textContent = format(from); requestAnimationFrame(step);
}

const sysDark = () => window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
const curTheme = () => document.documentElement.dataset.theme || (sysDark() ? 'dark' : 'light');
function paintThemeBtn(){
  const dark = curTheme() === 'dark';
  const b = document.getElementById('themeBtn');
  // both labels are always rendered on top of each other, so the button never changes width
  b.innerHTML = (dark ? SUN : MOON) + `<span class="lbl"><span class="${dark ? '' : 'off'}">Licht</span><span class="${dark ? 'off' : ''}">Donker</span></span>`;
  b.setAttribute('aria-label', dark ? 'Schakel naar lichte modus' : 'Schakel naar donkere modus');
  b.title = b.getAttribute('aria-label');
}
function setTheme(t){
  const html = document.documentElement;
  if (!reduceMotion()) { html.classList.add('theme-anim'); clearTimeout(setTheme.tid); setTheme.tid = setTimeout(() => html.classList.remove('theme-anim'), 450); }
  html.dataset.theme = t;
  try { localStorage.setItem('bn_theme', t); } catch(e){}
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'dark' ? '#FF2D43' : '#E2001A';
  paintThemeBtn();
  replayAnim(document.getElementById('themeBtn'), 'spin');
}
document.getElementById('themeBtn').onclick = () => setTheme(curTheme() === 'dark' ? 'light' : 'dark');
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', paintThemeBtn);

const CATS = [

const CESUUR = [1.0,1.1,1.2,1.2,1.3,1.4,1.5,1.6,1.6,1.7,1.8,1.9,1.9,2.0,2.1,2.2,2.3,2.3,2.4,2.5,2.6,2.7,2.7,2.8,2.9,3.0,3.1,3.1,3.2,3.3,3.4,3.4,3.5,3.6,3.7,3.8,3.8,3.9,4.0,4.1,4.2,4.2,4.3,4.4,4.5,4.6,4.6,4.7,4.8,4.9,4.9,5.0,5.1,5.2,5.3,5.3,5.4,5.5,5.7,5.9,6.1,6.3,6.5,6.7,6.9,7.1,7.3,7.5,7.7,7.8,8.0,8.2,8.4,8.6,8.8,9.0,9.2,9.4,9.6,9.8,10.0];
const catOf = n => CATS.find(c => n >= c.from && n <= c.to);
DATA.forEach(q => q.c = catOf(q.n).id);

/* ---------- storage (optional, fails silently) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('bn_'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('bn_'+k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const GAP = /(…|\.\.\.)\s*(\([^)]*\))?/;
function sentenceHTML(q, fill){
  const s = esc(q.s);
  if (!GAP.test(q.s)) return s;
  return s.replace(GAP, (m, dots, hint) => fill != null
    ? `<span class="slot">${esc(fill)}</span>`
    : `<span class="slot empty">${hint ? esc(hint) : '&nbsp;'}</span>`);
}
function gradeFor(correct, total){
  if (total === 80) return CESUUR[correct];
  const pts = Math.round(correct / total * 80);
  return CESUUR[pts];
}
const fmt = g => g.toFixed(1).replace('.', ',');

/* ---------- state ---------- */
let S = null;       // current session
let timerId = null;

function startSession({title, questions, key, timed, practice}){
  S = { title, key, questions, answers: Array(questions.length).fill(null), i: 0,
        timed: !!timed, practice: !!practice, revealed: Array(questions.length).fill(false),
        ends: timed ? Date.now() + 60*60*1000 * questions.length / 80 : null, done: false };
  renderQuiz('up');
  tick();
  window.scrollTo(0, 0);
}

/* Build a new mixed test: same structure as the real exam (30/20/20/10), drawn from all 400 questions,
   skipping questions that appear in several versions with the same sentence. */
function buildMixed(){
  const out = [];
  CATS.forEach(c => {
    const pool = shuffle(DATA.filter(q => q.c === c.id));
    const seen = new Set(); const pick = [];
    for (const q of pool) { if (seen.has(q.s)) continue; seen.add(q.s); pick.push(q); if (pick.length === c.to - c.from + 1) break; }
    out.push(...pick);
  });
  return out.map(q => ({...q, o: q.o.slice()}));
}
function buildCategory(cid, size){
  const seen = new Set(); const pick = [];
  for (const q of shuffle(DATA.filter(q => q.c === cid))) { if (seen.has(q.s)) continue; seen.add(q.s); pick.push(q); if (pick.length === size) break; }
  return pick;
}

/* Start the same test again with the same questions and a clean slate. */
function restartSession(){
  if (!S) return;
  const timed = S.timed != null ? S.timed : (!S.practice && store.get('timed', false));
  const nav = $('.nav'); if (nav) nav.remove();
  startSession({ title: S.title, key: S.key, questions: S.questions, timed, practice: S.practice });
}
function confirmRestart(){
  if (S && !S.done && S.answers.some(a => a != null) && !confirm('Opnieuw beginnen? Je antwoorden van deze poging worden gewist.')) return;
  restartSession();
  replayAnim($('#restart'), 'spin');
}

/* ---------- History (stored per browser) ---------- */
const BYID = Object.fromEntries(DATA.map(q => [q.id, q]));
const getHist = () => store.get('hist', []);
function saveAttempt(a){ const h = getHist(); h.unshift(a); store.set('hist', h.slice(0, 100)); }
const fmtDate = t => new Date(t).toLocaleString('nl-NL', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const gradeCls = g => g >= 5.5 ? 'pass' : 'fail';
function versionStats(v){
  const list = getHist().filter(a => a.key === 'v' + v);
  if (!list.length) { const old = store.get('best', {})['v' + v]; return old != null ? { n: 0, best: old, last: null } : null; }
  return { n: list.length, best: Math.max(...list.map(a => a.grade)), last: list[0].grade };
}
function openAttempt(idx){
  const a = getHist()[idx]; if (!a) return;
  const qs = a.ids.map(id => BYID[id]).filter(Boolean);
  S = { title: a.title, key: a.key, questions: qs, answers: a.ans.slice(0, qs.length), i: 0, practice: a.practice,
        revealed: [], done: true, filter: a.correct === a.total ? 'all' : 'wrong', when: a.t };
  renderResults(a.correct, a.total, a.grade);
}
function historyHTML(showAll){
  const h = getHist(); if (!h.length) return '';
  const rows = (showAll ? h : h.slice(0, 8)).map((a, i) => `
    <button class="hrow" data-i="${i}">
      <span class="hgrade ${gradeCls(a.grade)}">${fmt(a.grade)}</span>
      <span class="hmain"><b>${esc(a.title)}</b><span>${fmtDate(a.t)} · ${a.correct} van ${a.total} goed</span></span>
      <span class="hgo">Bekijk</span>
    </button>`).join('');
  return `<h2>Jouw resultaten</h2>
    <div class="hist">${rows}</div>
    <div class="hist-actions">
      ${h.length > 8 ? `<button class="linkbtn" id="histAll">${showAll ? 'Toon minder' : `Toon alle ${h.length}`}</button>` : ''}
      <button class="linkbtn" id="histClear">Wis mijn resultaten</button>
    </div>`;
}
function bindHistory(showAll){
  document.querySelectorAll('.hrow').forEach(b => b.onclick = () => openAttempt(+b.dataset.i));
  if ($('#histAll')) $('#histAll').onclick = () => { $('#histWrap').innerHTML = historyHTML(!showAll); stagger('.hist', 20); bindHistory(!showAll); };
  if ($('#histClear')) $('#histClear').onclick = () => {
    if (!confirm('Al je opgeslagen resultaten en fouten wissen? Dit kun je niet ongedaan maken.')) return;
    store.set('hist', []); store.set('best', {}); store.set('wrong', []); renderHome();
  };
}

/* ---------- Home ---------- */
function renderHome(){
  $('#app').classList.remove('narrow');
  stopTimer(); S = null;
  $('#barRight').innerHTML = '';
  const wrong = store.get('wrong', []);
  const timedPref = store.get('timed', false);
  $('#app').innerHTML = `
    <h1 class="center">Oefentoetsen Basis Nederlands</h1>
    <p class="lead center">Kies een oefentoets. Aan het eind zie je je cijfer, je score per onderdeel en bij elke vraag waarom het goede antwoord goed is.</p>

    <div class="versions">
      ${[1,2,3,4,5].map(v => `<button class="vbtn" data-v="${v}">
        <span class="vnum">${v}</span>
        <span class="vtxt"><b>Oefentoets<span class="vn"> ${v}</span></b>${(st => st ? `<span>${st.n ? `${st.n}× gemaakt` : 'Gemaakt'}</span><span class="vscore">${st.last != null && st.n > 1 ? `Laatst <i class="${gradeCls(st.last)}">${fmt(st.last)}</i> · ` : ''}Beste <i class="${gradeCls(st.best)}">${fmt(st.best)}</i></span>` : '<span>Nog niet gemaakt</span>')(versionStats(v))}</span>
      </button>`).join('')}
    </div>
    <div class="opts"><label><input type="checkbox" id="timed" ${timedPref ? 'checked' : ''}> Met tijdslimiet van 60 minuten, zoals bij het echte tentamen</label></div>

    <h2>Meer oefenen</h2>
    <div class="mix">
      <button class="mixbtn" id="mixed"><span class="ico">⟳</span><span><strong>Nieuwe gemixte toets</strong><span>80 willekeurige vragen uit alle vijf de oefentoetsen, in dezelfde verdeling als het tentamen. Elke keer anders.</span></span></button>
      ${wrong.length ? `<button class="mixbtn" id="retry"><span class="ico">${wrong.length}</span><span><strong>Oefen je fouten</strong><span>Alle vragen die je eerder fout had. Goed beantwoorde vragen vallen van de lijst af.</span></span></button>` : ''}
    </div>

    <h2>Eén onderdeel oefenen</h2>
    <p class="lead" style="margin-bottom:10px">20 willekeurige vragen. Je ziet na elke vraag meteen of je het goed had.</p>
    <div class="cats">
      ${CATS.map(c => `<button class="catbtn" data-c="${c.id}" style="--cc:${c.color}"><strong>${c.name}</strong><span>Vragen uit alle vijf de oefentoetsen</span></button>`).join('')}
    </div>

    <div id="histWrap">${historyHTML(false)}</div>

    <h2>Over het echte tentamen</h2>
    <div class="exam">
      <span>Digitaal in het computerlokaal, 60 minuten, 80 meerkeuzevragen:</span>
      <ul>${CATS.map(c => `<li style="--cc:${c.color}">${c.name}<b>${c.to - c.from + 1} vragen</b></li>`).join('')}</ul>
      <span>Je bent geslaagd met minimaal 57 van de 80 goed (71%), dat is een 5,5. De oefentoetsen hebben dezelfde opbouw en cijfertabel.</span>
    </div>

    <p class="note">De uitleg bij de antwoorden is als hulp toegevoegd en komt niet van de docent. Het antwoordenblad van de opleiding blijft leidend. Je voortgang wordt alleen in deze browser bewaard.</p>
  `;
  bindHistory(false);
  enter('up');
  stagger('.versions, .mix, .cats, .hist');
  $('#timed').onchange = e => store.set('timed', e.target.checked);
  document.querySelectorAll('.vbtn').forEach(b => b.onclick = () => {
    const v = +b.dataset.v;
    startSession({ title: 'Oefentoets ' + v, key: 'v' + v, questions: DATA.filter(q => q.v === v), timed: $('#timed').checked });
  });
  $('#mixed').onclick = () => startSession({ title: 'Gemixte toets', key: 'mix', questions: buildMixed(), timed: $('#timed').checked });
  if ($('#retry')) $('#retry').onclick = () => {
    const ids = new Set(store.get('wrong', []));
    startSession({ title: 'Je fouten', key: 'retry', questions: shuffle(DATA.filter(q => ids.has(q.id))), practice: true });
  };
  document.querySelectorAll('.catbtn').forEach(b => b.onclick = () => {
    startSession({ title: CAT[b.dataset.c].name, key: 'cat', questions: buildCategory(b.dataset.c, 20), practice: true });
  });
  window.scrollTo(0, 0);
}

/* ---------- Quiz ---------- */
function renderBar(){
  const answered = S.answers.filter(a => a != null).length;
  $('#barRight').innerHTML = `${S.timed ? `<span class="timer" id="timer"></span>` : ''}
    <button class="bar-btn icon-btn" id="restart" type="button" aria-label="Opnieuw beginnen" title="Opnieuw beginnen">${RESTART}</button>
    <button class="bar-btn gridbtn" id="openSheet" aria-label="Overzicht van de vragen">${answered}/${S.questions.length}</button>`;
  $('#openSheet').onclick = openSheet;
  $('#restart').onclick = confirmRestart;
  if (S.lastAnswered != null && answered !== S.lastAnswered) replayAnim($('#openSheet'), 'bump');
  S.lastAnswered = answered;
  updateTimer();
}
/* anim: 'up' | 'next' | 'prev' (new question), 'choose' (answer picked), 'reveal' (answer checked) */
function renderQuiz(anim){
  $('#app').classList.add('narrow');
  const q = S.questions[S.i], c = CAT[q.c], a = S.answers[S.i];
  const shown = S.practice && S.revealed[S.i];
  renderBar();
  $('#app').innerHTML = `
    <div class="qmeta"><span class="qnum">Vraag ${S.i + 1} van ${S.questions.length}</span>
      <span class="tag" style="--cc:${c.color}">${c.name}</span>
      <span>${[S.title === c.name ? '' : esc(S.title), S.key !== 'v'+q.v ? `versie ${q.v}, vraag ${q.n}` : ''].filter(Boolean).join(' · ')}</span></div>
    <div class="progress"><i style="width:${S.pct != null ? S.pct : 0}%"></i></div>
    <div class="sentence ${shown ? 'revealed' : ''}">${sentenceHTML(q, shown ? q.o[q.a] : (a != null ? q.o[a] : null))}</div>
    <p class="instr">${esc(q.i)}</p>
    <div class="choices">${q.o.map((o, k) => {
      let cls = '';
      if (shown) cls = k === q.a ? 'right' : (k === a ? 'wrong' : '');
      return `<button class="choice ${cls}" data-k="${k}" aria-pressed="${a === k}" ${shown ? 'disabled' : ''}><span class="k">${'abc'[k]}</span><span>${esc(o)}</span></button>`;
    }).join('')}</div>
    ${shown ? `<div class="feedback ${a === q.a ? 'ok' : 'no'}"><b>${a === q.a ? 'Goed!' : 'Helaas, het juiste antwoord is ' + esc(q.o[q.a]) + '.'}</b>${esc(q.x)}</div>` : ''}
  `;
  document.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(+b.dataset.k));
  renderNav();

  // progress bar glides from the previous position to the new one
  const pct = (S.i + 1) / S.questions.length * 100, bar = $('.progress i');
  void bar.offsetWidth; bar.style.width = pct + '%'; S.pct = pct;

  if (anim === 'up' || anim === 'next' || anim === 'prev') enter(anim);
  else enter(null);
  if (anim === 'choose') {
    replayAnim($(`.choice[data-k="${a}"]`), 'just');
    replayAnim($('.sentence .slot'), 'pop');
  }
  if (anim === 'reveal') {
    document.querySelectorAll('.choice.right, .choice.wrong').forEach(el => replayAnim(el, 'anim'));
    replayAnim($('.feedback'), 'anim');
  }
}
function renderNav(){
  let nav = $('.nav');
  if (!nav) { nav = document.createElement('div'); nav.className = 'nav'; document.body.appendChild(nav); }
  const last = S.i === S.questions.length - 1;
  const a = S.answers[S.i];
  let nextBtn;
  if (S.practice && !S.revealed[S.i]) nextBtn = `<button class="btn primary" id="next" ${a == null ? 'disabled' : ''}>Controleer</button>`;
  else nextBtn = last ? `<button class="btn primary" id="finish">Inleveren</button>` : `<button class="btn primary" id="next">Volgende</button>`;
  nav.innerHTML = `<div class="nav-in">
    <button class="btn" id="prev" ${S.i === 0 ? 'disabled' : ''} aria-label="Vorige vraag">Vorige</button>
    <span class="grow"></span>
    ${!last && !S.practice ? `<button class="btn" id="finish2">Inleveren</button>` : ''}
    ${nextBtn}</div>`;
  $('#prev').onclick = () => go(S.i - 1);
  if ($('#next')) $('#next').onclick = next;
  if ($('#finish')) $('#finish').onclick = confirmFinish;
  if ($('#finish2')) $('#finish2').onclick = confirmFinish;
}
function choose(k){
  if (S.practice && S.revealed[S.i]) return;
  S.answers[S.i] = k;
  renderQuiz('choose');
  if (!S.practice && S.i < S.questions.length - 1) {
    clearTimeout(S.adv);
    S.adv = setTimeout(() => { if (S && !S.done && S.answers[S.i] === k) go(S.i + 1); }, 450);
  }
}
function next(){
  if (S.practice && !S.revealed[S.i]) { if (S.answers[S.i] == null) return; S.revealed[S.i] = true; renderQuiz('reveal'); return; }
  if (S.i < S.questions.length - 1) go(S.i + 1); else confirmFinish();
}
function go(i){ clearTimeout(S.adv); if (i < 0 || i >= S.questions.length || i === S.i) return; const dir = i > S.i ? 'next' : 'prev'; S.i = i; renderQuiz(dir); window.scrollTo(0, 0); }
function confirmFinish(){
  const open = S.answers.filter(a => a == null).length;
  if (open && !confirm(`Je hebt nog ${open} ${open === 1 ? 'vraag' : 'vragen'} niet beantwoord. Toch inleveren?`)) return;
  finish();
}

/* ---------- Overview sheet ---------- */
function openSheet(){
  const showRes = S.practice;
  $('#sheetIn').innerHTML = `<div class="sheet-head"><strong>Overzicht</strong><span style="display:flex;gap:8px"><button class="btn" id="sheetRestart" style="white-space:nowrap">↺ Opnieuw</button><button class="btn" id="closeSheet">Sluiten</button></span></div>
    <div class="dots">${S.questions.map((q, i) => {
      let cls = S.answers[i] != null ? 'done' : '';
      if (showRes && S.revealed[i]) cls = S.answers[i] === q.a ? 'r' : 'w';
      if (i === S.i) cls += ' cur';
      return `<button class="dot ${cls}" data-i="${i}" style="--cc:${CAT[q.c].color}" aria-label="Vraag ${i+1}${S.answers[i] != null ? ', beantwoord' : ''}">${i + 1}</button>`;
    }).join('')}</div>
    <p class="legend">Grijs is beantwoord. Het gekleurde streepje onderaan geeft het onderdeel aan: ${CATS.map(c => `<span style="color:${c.color};font-weight:700">${c.name}</span>`).join(', ')}.</p>`;
  $('#sheet').classList.add('open');
  $('#closeSheet').onclick = closeSheet;
  $('#sheetRestart').onclick = () => { closeSheet(); confirmRestart(); };
  document.querySelectorAll('.dot').forEach(b => b.onclick = () => { closeSheet(); go(+b.dataset.i); });
}
function closeSheet(){ $('#sheet').classList.remove('open'); }
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };

/* ---------- Timer ---------- */
function tick(){ stopTimer(); if (!S || !S.timed) return; timerId = setInterval(updateTimer, 1000); }
function stopTimer(){ clearInterval(timerId); timerId = null; }
function updateTimer(){
  const el = $('#timer'); if (!S || !S.timed || !el) return;
  const left = Math.max(0, S.ends - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  el.textContent = `${m}:${String(s).padStart(2, '0')}`;
  el.classList.toggle('low', left < 5 * 60000);
  if (left <= 0 && !S.done) { alert('De tijd is om. Je toets wordt ingeleverd.'); finish(); }
}

/* ---------- Results ---------- */
function finish(){
  S.done = true; stopTimer(); closeSheet();
  const nav = $('.nav'); if (nav) nav.remove();
  const qs = S.questions, total = qs.length;
  const correct = qs.filter((q, i) => S.answers[i] === q.a).length;
  const grade = gradeFor(correct, total);

  // remember this attempt (with answers, so it can be reviewed later) and the questions answered wrong
  saveAttempt({ t: Date.now(), key: S.key, title: S.title, practice: S.practice, correct, total, grade,
                ids: qs.map(q => q.id), ans: S.answers.map(a => a == null ? null : a) });
  const wrong = new Set(store.get('wrong', []));
  qs.forEach((q, i) => { if (S.answers[i] === q.a) wrong.delete(q.id); else if (S.answers[i] != null) wrong.add(q.id); });
  store.set('wrong', [...wrong]);

  S.filter = correct === total ? 'all' : 'wrong';
  renderResults(correct, total, grade);
}
function renderResults(correct, total, grade){
  $('#app').classList.remove('narrow');
  $('#barRight').innerHTML = '';
  const qs = S.questions;
  const per = CATS.map(c => {
    const idx = qs.map((q, i) => i).filter(i => qs[i].c === c.id);
    return { c, n: idx.length, ok: idx.filter(i => S.answers[i] === qs[i].a).length };
  }).filter(r => r.n);
  const pass = grade >= 5.5;
  $('#app').innerHTML = `
    <div class="results-top"><div><p class="qnum" style="margin:0">${esc(S.title)}${S.when ? ` <span style="color:var(--ink-2);font-weight:500">· gemaakt op ${fmtDate(S.when)}</span>` : ''}</p>
    <div class="score">
      <div class="grade anim ${pass ? 'pass' : ''}" id="grade">${fmt(grade)}</div>
      <div class="score-txt"><b>${correct} van ${total} goed</b><span>${pass ? 'Voldoende, je zou geslaagd zijn.' : 'Nog niet voldoende. Je hebt minimaal 57 van de 80 goed nodig (71%).'}${total !== 80 ? ' Cijfer omgerekend naar een toets van 80 vragen.' : ''}</span></div>
    </div>
    </div><div><h2>Per onderdeel</h2>
    <div class="catrows">${per.map(r => `<div class="catrow" style="--cc:${r.c.color}"><span>${r.c.name}</span><div class="meter"><i style="width:0" data-w="${r.ok / r.n * 100}"></i></div><span class="n">${r.ok}/${r.n}</span></div>`).join('')}</div></div></div>
    <div class="actions">
      ${correct < total ? `<button class="btn primary" id="again">Oefen deze ${total - correct} fouten opnieuw</button>` : ''}
      <button class="btn ${correct < total ? '' : 'primary'}" id="redo">Maak deze toets opnieuw</button>
      <button class="btn" id="toHome">Terug naar het overzicht</button>
    </div>
    <h2>Nakijken</h2>
    <div class="filter" role="group" aria-label="Filter">
      <button data-f="wrong" aria-pressed="${S.filter === 'wrong'}">Fout (${total - correct})</button>
      <button data-f="all" aria-pressed="${S.filter === 'all'}">Alle vragen</button>
      ${per.map(r => `<button data-f="${r.c.id}" aria-pressed="${S.filter === r.c.id}">${r.c.name}</button>`).join('')}
    </div>
    <div class="review" id="review"></div>`;
  renderReview();
  enter('up');
  // grade counts up, meters fill one after another
  countUp($('#grade'), 1, grade, 900, fmt);
  const meters = document.querySelectorAll('.meter i');
  meters.forEach(m => m.offsetWidth);
  meters.forEach((m, i) => { m.style.setProperty('--i', i); m.style.width = m.dataset.w + '%'; });
  $('#redo').onclick = () => {
    if (S.key.startsWith('v')) S.questions = DATA.filter(q => q.v === +S.key.slice(1));
    restartSession();
  };
  document.querySelectorAll('.filter button').forEach(b => b.onclick = () => {
    S.filter = b.dataset.f;
    document.querySelectorAll('.filter button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderReview();
  });
  $('#toHome').onclick = renderHome;
  if ($('#again')) $('#again').onclick = () => {
    const wrongQs = qs.filter((q, i) => S.answers[i] !== q.a);
    startSession({ title: 'Fouten uit ' + S.title, key: 'retry', questions: wrongQs, practice: true });
  };
  window.scrollTo(0, 0);
}
function renderReview(){
  const qs = S.questions;
  const items = qs.map((q, i) => ({ q, i, a: S.answers[i] })).filter(({ q, a }) =>
    S.filter === 'all' ? true : S.filter === 'wrong' ? a !== q.a : q.c === S.filter);
  $('#review').innerHTML = items.length ? items.map(({ q, i, a }) => {
    const ok = a === q.a;
    return `<article class="ritem ${ok ? 'ok' : ''}">
      <div class="top"><span>Vraag ${i + 1}${S.key.startsWith('v') ? '' : ` · versie ${q.v}, vraag ${q.n}`}</span><span style="color:${CAT[q.c].color};font-weight:700">${CAT[q.c].name}</span></div>
      <div class="s">${sentenceHTML(q, GAP.test(q.s) ? q.o[q.a] : null)}</div>
      <div style="font-size:.85rem;color:var(--ink-2);margin-bottom:6px">${esc(q.i)}</div>
      <div class="ans">
        ${ok ? `<span class="good">✓ ${esc(q.o[q.a])}</span>` : `
          <span class="yours">✗ Jouw antwoord: ${a == null ? 'niet beantwoord' : esc(q.o[a])}</span>
          <span class="good">✓ Goed: ${esc(q.o[q.a])}</span>`}
      </div>
      <div class="why"><b>Waarom</b>${esc(q.x)}</div>
    </article>`;
  }).join('') : `<div class="empty-state">Geen fouten in dit onderdeel. Mooi zo.</div>`;
  stagger('#review', 10);
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#sheet').classList.contains('open')) { if (e.key === 'Escape') closeSheet(); return; }
  const k = { a:0, b:1, c:2, '1':0, '2':1, '3':2 }[e.key.toLowerCase()];
  if (k != null && k < S.questions[S.i].o.length) { choose(k); return; }
  if (e.key === 'ArrowRight' || e.key === 'Enter') { if (document.activeElement?.tagName === 'BUTTON' && e.key === 'Enter') return; e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') go(S.i - 1);
});
window.addEventListener('beforeunload', e => { if (S && !S.done && S.answers.some(a => a != null)) { e.preventDefault(); e.returnValue = ''; } });

$('#home').onclick = () => { if (S && !S.done && S.answers.some(a => a != null) && !confirm('Je toets is nog bezig. Stoppen en teruggaan naar het overzicht?')) return; const nav = $('.nav'); if (nav) nav.remove(); renderHome(); };
renderHome();
</script>
</body>
</html>
